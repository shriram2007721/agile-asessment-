apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-response-portal
  labels:
    app: disaster-response
    tier: frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: disaster-response
  template:
    metadata:
      labels:
        app: disaster-response
    spec:
      containers:
      - name: web-portal
        image: yourdockerhubusername/ddma-disaster-response-portal:VERSION_PLACEHOLDER
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http-port
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        # Continuous Self-Healing Real-time Probes Configuration
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: disaster-response-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: http-port
    protocol: TCP
  selector:
    app: disaster-response
